# .github/workflows/fetch-weather-tide.yml
name: Fetch Weather & Tide Data

on:
  schedule:
    # Run daily at 5am UTC (midnight EST / 1am EDT)
    - cron: '0 5 * * *'
    # Retry hours: 6am-11pm UTC (1am-6pm EST / 2am-7pm EDT)
    - cron: '0 6-23 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if not scheduled'
        required: false
        default: 'false'

# Permissions needed for the action to push commits
permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if retry is needed
      id: check_retry
      env:
        FORCE_RUN: ${{ github.event.inputs.force_run }}
      run: |
        # Always run at midnight or if manually forced
        CURRENT_HOUR=$(date -u +%H)
        IS_MIDNIGHT=$([[ "$CURRENT_HOUR" == "00" ]] && echo "true" || echo "false")
        IS_MANUAL=$([[ "$FORCE_RUN" == "true" ]] && echo "true" || echo "false")

        if [[ "$IS_MIDNIGHT" == "true" || "$IS_MANUAL" == "true" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "Daily run or manual trigger - proceeding"
          exit 0
        fi

        # For hourly runs, check if we need to retry
        if [[ -f "data/weather-data.json" ]]; then
          LAST_SUCCESS=$(node -pe "
            try {
              const data = JSON.parse(require('fs').readFileSync('data/weather-data.json', 'utf8'));
              new Date(data.lastUpdated).toISOString().split('T')[0];
            } catch(e) {
              '';
            }
          ")

          TODAY=$(date -u +%Y-%m-%d)

          if [[ "$LAST_SUCCESS" == "$TODAY" ]]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Already have today's data - skipping retry"
            exit 0
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "No successful data today - will retry"
          fi
        else
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "No data file exists - will try to create"
        fi

    - name: Setup Node.js
      if: steps.check_retry.outputs.should_run == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create data directory
      if: steps.check_retry.outputs.should_run == 'true'
      run: mkdir -p data

    - name: Fetch weather and tide data
      if: steps.check_retry.outputs.should_run == 'true'
      id: fetch_data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node << 'EOF'
        // Mill Cove Mood - Weather & Tide Data Fetcher for GitHub Actions
        const fs = require('fs');
        const path = require('path');

        const CONFIG = {
            LATITUDE: 42.2181,
            LONGITUDE: -70.9395,
            NOAA_STATION_ID: '8443970'
        };

        class WeatherTideFetcher {
            async fetchWeatherData() {
                // Using Open-Meteo - free weather API, no API key needed
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LATITUDE}&longitude=${CONFIG.LONGITUDE}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,sunrise,sunset,wind_speed_10m_max,relative_humidity_2m_mean,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America/New_York&forecast_days=7`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Weather API error: ${response.status}`);
                }

                const data = await response.json();
                return this.processWeatherData(data);
            }

            processWeatherData(data) {
                return data.daily.time.map((dateStr, index) => {
                    const date = new Date(dateStr);
                    const tempHigh = Math.round(data.daily.temperature_2m_max[index]);
                    const tempLow = Math.round(data.daily.temperature_2m_min[index]);
                    const rainChance = Math.round(data.daily.precipitation_probability_max[index] || 0);
                    const weatherCode = data.daily.weather_code[index];

                    const weatherEmoji = this.getWeatherEmojiFromCode(weatherCode);
                    const description = this.getWeatherDescription(weatherCode);
                    const displayDate = index === 0 ? 'Today' : date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });

                    const sunrise = this.formatISOTime(data.daily.sunrise[index]);
                    const sunset = this.formatISOTime(data.daily.sunset[index]);

                    const humidityRaw = data.daily.relative_humidity_2m_mean?.[index];
                    const windRaw = data.daily.wind_speed_10m_max?.[index];
                    const uvRaw = data.daily.uv_index_max?.[index];

                    return {
                        date: displayDate,
                        temp: tempHigh,
                        tempLow: tempLow,
                        condition: weatherEmoji,
                        description: description,
                        humidity: humidityRaw != null ? Math.round(humidityRaw) : null,
                        wind: windRaw != null ? `${Math.round(windRaw)} mph` : null,
                        uvIndex: uvRaw != null ? Math.round(uvRaw) : null,
                        rainChance: rainChance,
                        sunrise: sunrise,
                        sunset: sunset,
                        rawDate: dateStr
                    };
                });
            }

            getWeatherEmojiFromCode(code) {
                // WMO Weather interpretation codes
                if (code === 0) return '☀️'; // Clear sky
                if (code <= 3) return '⛅'; // Partly cloudy
                if ([45, 48].includes(code)) return '🌫️'; // Fog
                if ([51, 53, 55].includes(code)) return '🌦️'; // Drizzle
                if ([61, 63, 65].includes(code)) return '🌧️'; // Rain
                if ([80, 81, 82].includes(code)) return '🌧️'; // Rain showers
                if ([71, 73, 75, 77].includes(code)) return '❄️'; // Snow
                if ([95, 96, 99].includes(code)) return '⛈️'; // Thunderstorm
                return '⛅'; // Default
            }

            getWeatherDescription(code) {
                if (code === 0) return 'Clear';
                if (code <= 3) return 'Partly Cloudy';
                if ([45, 48].includes(code)) return 'Foggy';
                if ([51, 53, 55].includes(code)) return 'Drizzle';
                if ([61, 63, 65].includes(code)) return 'Rain';
                if ([80, 81, 82].includes(code)) return 'Rain Showers';
                if ([71, 73, 75, 77].includes(code)) return 'Snow';
                if ([95, 96, 99].includes(code)) return 'Thunderstorm';
                return 'Cloudy';
            }

            async fetchTideData() {
                // Running at local midnight, so get 7 days starting today
                const startDate = new Date();
                const endDate = new Date();
                endDate.setDate(startDate.getDate() + 7);

                const startDateStr = this.formatDateForNOAA(startDate);
                const endDateStr = this.formatDateForNOAA(endDate);

                console.log(`Fetching tide data from ${startDateStr} to ${endDateStr}`);
                
                const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=NOS.COOPS.TAC.WL&begin_date=${startDateStr}&end_date=${endDateStr}&datum=MLLW&station=${CONFIG.NOAA_STATION_ID}&time_zone=lst_ldt&units=english&interval=hilo&format=json`;

                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Tide API error: ${response.status}`);
                }

                const data = await response.json();
                return this.processTideData(data);
            }

            formatDateForNOAA(date) {
                return date.getFullYear() +
                       String(date.getMonth() + 1).padStart(2, '0') +
                       String(date.getDate()).padStart(2, '0');
            }

            processTideData(data) {
                if (!data.predictions) {
                    throw new Error('No tide data returned from NOAA API');
                }

                const tidesByDate = {};

                console.log(`Processing ${data.predictions.length} tide predictions`);

                data.predictions.forEach(prediction => {
                    // Parse the datetime string (format: "2025-07-20 06:32")
                    const dateTime = prediction.t;
                    const date = dateTime.split(' ')[0];
                    const time = this.formatTime(dateTime.split(' ')[1]);
                    const type = prediction.type;
                    const height = parseFloat(prediction.v).toFixed(1); // Height in feet

                    if (!tidesByDate[date]) {
                        tidesByDate[date] = { high: [], low: [] };
                    }

                    const tideInfo = {
                        time: time,
                        height: height
                    };

                    if (type === 'H') {
                        tidesByDate[date].high.push(tideInfo);
                    } else {
                        tidesByDate[date].low.push(tideInfo);
                    }
                });

                // Log tide data for debugging
                Object.keys(tidesByDate).forEach(date => {
                    const tides = tidesByDate[date];
                    console.log(`${date}: High tides: ${tides.high.map(t => `${t.time} (${t.height}ft)`).join(', ')}, Low tides: ${tides.low.map(t => `${t.time} (${t.height}ft)`).join(', ')}`);
                });

                return tidesByDate;
            }

            formatTime(timeStr) {
                const [hours, minutes] = timeStr.split(':');
                const hour = parseInt(hours);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const displayHour = hour % 12 || 12;
                return `${displayHour}:${minutes} ${ampm}`;
            }

            formatISOTime(isoStr) {
                // Open-Meteo returns local times like "2026-07-26T05:23"
                if (!isoStr) return null;
                const timePart = isoStr.split('T')[1];
                if (!timePart) return null;
                return this.formatTime(timePart);
            }

            async fetchOceanData() {
                // Open-Meteo Marine API - free, no API key needed. Returns Celsius.
                const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${CONFIG.LATITUDE}&longitude=${CONFIG.LONGITUDE}&hourly=sea_surface_temperature&timezone=America/New_York&forecast_days=7`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`Marine API error: ${response.status}`);
                    }
                    const data = await response.json();
                    return this.processOceanData(data);
                } catch (error) {
                    // Ocean temp is a nice-to-have; don't fail the whole run without it
                    console.error('Could not fetch ocean temperature:', error.message);
                    return {};
                }
            }

            processOceanData(data) {
                const oceanByDate = {};
                if (!data.hourly || !data.hourly.time) {
                    return oceanByDate;
                }

                const times = data.hourly.time;
                const temps = data.hourly.sea_surface_temperature;

                // Collect all valid readings per date, then average
                const sums = {};
                times.forEach((dateTime, i) => {
                    const date = dateTime.split('T')[0];
                    const tempC = temps[i];
                    if (tempC === null || tempC === undefined) return;
                    if (!sums[date]) sums[date] = { total: 0, count: 0 };
                    sums[date].total += tempC;
                    sums[date].count += 1;
                });

                Object.keys(sums).forEach(date => {
                    const avgC = sums[date].total / sums[date].count;
                    const avgF = Math.round(avgC * 9 / 5 + 32);
                    oceanByDate[date] = avgF;
                    console.log(`${date}: Ocean temp ${avgF}°F`);
                });

                return oceanByDate;
            }

            async fetchBridgeData() {
                // Fore River Bridge openings (community API, no key needed)
                const url = 'https://foreriverbridge.com/api/bridge/openings';

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`Bridge API error: ${response.status}`);
                    }
                    const data = await response.json();
                    return this.processBridgeData(data);
                } catch (error) {
                    // Bridge openings are a nice-to-have; don't fail the whole run without them
                    console.error('Could not fetch bridge openings:', error.message);
                    return {};
                }
            }

            processBridgeData(openings) {
                const bridgeByDate = {};
                if (!Array.isArray(openings)) {
                    return bridgeByDate;
                }

                openings.forEach(opening => {
                    // Prefer the observed crossing time over the scheduled one
                    const when = opening.actualCrossingTime || opening.scheduledTime;
                    if (!when) return;
                    const dt = new Date(when);
                    if (isNaN(dt)) return;

                    const date = dt.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
                    const time = dt.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });

                    // southbound = inbound (up the Fore River), northbound = outbound (to sea)
                    const reason = (opening.reason || '').toLowerCase();
                    let direction = null;
                    if (reason.includes('inbound') || opening.direction === 'southbound') {
                        direction = 'inbound';
                    } else if (reason.includes('outbound') || opening.direction === 'northbound') {
                        direction = 'outbound';
                    }

                    const vessel = opening.shipName && opening.shipName !== 'UNKNOWN' ? opening.shipName : null;

                    if (!bridgeByDate[date]) bridgeByDate[date] = [];
                    bridgeByDate[date].push({
                        time,
                        vessel,
                        vesselType: opening.shipType || null,
                        direction,
                        timestamp: when
                    });
                });

                Object.keys(bridgeByDate).forEach(date => {
                    const list = bridgeByDate[date];
                    list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    console.log(`${date}: Bridge openings: ${list.map(o => `${o.time} ${o.vessel || 'unknown vessel'} (${o.direction || '?'})`).join(', ')}`);
                });

                return bridgeByDate;
            }

            checkMoodDay(weather, tides) {
                const hasGoodTide = tides.high.some(tide => {
                    const [timeStr, ampm] = tide.time.split(' ');
                    const [hours] = timeStr.split(':');
                    const hour24 = ampm === 'PM' && hours !== '12' ? parseInt(hours) + 12 :
                                  ampm === 'AM' && hours === '12' ? 0 : parseInt(hours);
                    return hour24 >= 12 && hour24 <= 20;
                });

                const goodTemp = weather.temp >= 60;
                const lowRain = weather.rainChance < 30;

                return hasGoodTide && goodTemp && lowRain;
            }

            async run() {
                try {
                    console.log('Fetching weather data...');
                    const weatherData = await this.fetchWeatherData();

                    console.log('Fetching tide data...');
                    const tideData = await this.fetchTideData();

                    console.log('Fetching ocean temperature data...');
                    const oceanData = await this.fetchOceanData();

                    console.log('Fetching bridge opening data...');
                    const bridgeData = await this.fetchBridgeData();

                    console.log('Combining data...');
                    const combinedData = weatherData.map(day => {
                        const tides = tideData[day.rawDate] || { high: [], low: [] };
                        const oceanTemp = oceanData[day.rawDate] ?? null;
                        const bridgeOpenings = bridgeData[day.rawDate] || [];
                        const isMoodDay = this.checkMoodDay(day, tides);

                        return {
                            ...day,
                            tides,
                            oceanTemp,
                            bridgeOpenings,
                            isMoodDay
                        };
                    });

                    // Add metadata
                    const output = {
                        lastUpdated: new Date().toISOString(),
                        location: 'Weymouth, MA (Mill Cove)',
                        source: 'Open-Meteo, NOAA & foreriverbridge.com',
                        data: combinedData
                    };

                    // Save to file
                    fs.writeFileSync('data/weather-data.json', JSON.stringify(output, null, 2));
                    console.log('Data saved successfully');

                    return output;

                } catch (error) {
                    console.error('Error fetching data:', error);

                    // Check if we have existing data
                    const dataFile = 'data/weather-data.json';
                    if (fs.existsSync(dataFile)) {
                        console.log('Keeping existing data due to fetch failure');

                        // Update the existing file with failure info
                        try {
                            const existingData = JSON.parse(fs.readFileSync(dataFile, 'utf8'));
                            existingData.lastAttempted = new Date().toISOString();
                            existingData.lastError = error.message;
                            existingData.failedAttempts = (existingData.failedAttempts || 0) + 1;

                            fs.writeFileSync(dataFile, JSON.stringify(existingData, null, 2));
                            console.log('Updated existing data with failure info');
                        } catch (updateError) {
                            console.error('Could not update existing data:', updateError);
                        }
                    }

                    process.exit(1);
                }
            }
        }

        const fetcher = new WeatherTideFetcher();
        fetcher.run();
        EOF

    - name: Commit and push data (only if successful)
      if: steps.check_retry.outputs.should_run == 'true' && success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/weather-data.json

        # Only commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Update weather and tide data - $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
        else
          echo "No changes to commit"
        fi
